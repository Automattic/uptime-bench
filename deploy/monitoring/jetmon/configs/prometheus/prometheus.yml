global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          instance: monitoring.example.com
          role: monitoring

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000
        labels:
          instance: monitoring.example.com
          role: monitoring

  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.d/node_*.yml
        refresh_interval: 30s

  - job_name: cadvisor
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.d/cadvisor_*.yml
        refresh_interval: 30s

  - job_name: dockerstats
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.d/dockerstats_*.yml
        refresh_interval: 30s

  - job_name: process
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.d/process_*.yml
        refresh_interval: 30s

  - job_name: smartctl
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.d/smartctl_*.yml
        refresh_interval: 30s
