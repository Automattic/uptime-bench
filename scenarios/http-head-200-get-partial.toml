id          = "http-head-200-get-partial"
version     = "1"
description = "HEAD returns 200 while GET returns a truncated body — catches false-up signals from HEAD-only checks"
target      = "bench-a"
monitors    = ["jetmon-v2"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 1008

[[failures]]
type                 = "http_partial"
method               = "GET"
truncate_after_bytes = 100
