id          = "http-head-200-get-redirect-loop"
version     = "1"
description = "HEAD returns 200 while GET enters a redirect loop — catches false-up signals from HEAD-only checks"
target      = "bench-a"
monitors    = ["jetmon-v1"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 1007

[[failures]]
type    = "http_redirect"
method  = "GET"
variant = "loop"
