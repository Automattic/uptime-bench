id          = "dns-ns-unavailable-servfail"
version     = "1"
description = "One authoritative nameserver returns SERVFAIL — tests nameserver-specific error tolerance"
target      = "bench-a"
monitors    = ["jetmon-v2"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 4007

[[failures]]
type = "dns_ns_unavailable"
mode = "servfail"
