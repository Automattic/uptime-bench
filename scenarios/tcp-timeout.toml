id          = "tcp-timeout"
version     = "1"
description = "TCP connection attempt times out instead of refusing immediately — tests connect-timeout handling"
target      = "bench-a"
monitors    = ["jetmon-v2"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 1016

[[failures]]
type = "tcp_timeout"
