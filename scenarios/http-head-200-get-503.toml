id          = "http-head-200-get-503"
version     = "1"
description = "HEAD returns 200 while GET returns 503 — catches false-up signals from HEAD-only checks"
target      = "bench-a"
monitors    = ["jetmon-v2"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 1006

[[failures]]
type        = "http_method_status"
method      = "GET"
status_code = 503
