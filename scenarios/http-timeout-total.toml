id          = "http-timeout-total"
version     = "1"
description = "Connection stays open without completing the HTTP exchange — tests total request timeout handling"
target      = "bench-a"
monitors    = ["jetmon-v1"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 1015

[[failures]]
type  = "http_timeout"
phase = "total"
delay = "35s"
