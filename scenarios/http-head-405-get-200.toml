id          = "http-head-405-get-200"
version     = "1"
description = "HEAD returns 405 while GET returns 200 — catches false-down signals from HEAD-only checks"
target      = "bench-a"
monitors    = ["jetmon-v1"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 1005

[[failures]]
type        = "http_method_status"
method      = "HEAD"
status_code = 405
