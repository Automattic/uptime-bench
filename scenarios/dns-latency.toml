id          = "dns-latency"
version     = "1"
description = "Authoritative DNS replies slowly but successfully — tests resolver latency and timeout thresholds"
target      = "bench-a"
monitors    = ["jetmon-v2"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 4005

[[failures]]
type          = "dns_latency"
added_latency = "5s"
