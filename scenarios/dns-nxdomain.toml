id          = "dns-nxdomain"
version     = "1"
description = "Authoritative DNS returns NXDOMAIN for the monitored hostname — tests hard DNS-name failure detection"
target      = "bench-a"
monitors    = ["jetmon-v1"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 4001

[[failures]]
type = "dns_nxdomain"
