id          = "content-keyword-injected"
version     = "1"
description = "Unexpected keyword injected into otherwise-normal page (200 OK) — tests detection of compromise indicators"
target      = "bench-a"
monitors    = ["jetmon"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 2006

# "HACKED" is injected into the page body. Monitors configured to alert on
# unexpected terms in the response body should fire.
[[failures]]
type    = "http_body"
content = "keyword_injected"
keyword = "HACKED"
