id          = "content-keyword-injected"
version     = "1"
description = "Unexpected keyword injected into otherwise-normal page (200 OK) — tests detection of compromise indicators"
target      = "bench-a"
monitors    = ["jetmon-v2"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 2006

# "HACKED" is injected into the page body. Monitors configured to alert
# when an unexpected term appears in the response body should fire.
keyword       = "HACKED"
keyword_check = "absent"

[[failures]]
type    = "http_body"
content = "keyword_injected"
