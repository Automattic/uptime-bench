id          = "http-head-timeout-get-200"
version     = "1"
description = "HEAD stalls while GET returns 200 — catches false-down signals from HEAD-only checks"
target      = "bench-a"
monitors    = ["jetmon-v2"]
check_frequency = "60s"
grace_period    = "180s"
duration        = "300s"
seed            = 1011

[[failures]]
type   = "http_timeout"
method = "HEAD"
phase  = "ttfb"
delay  = "35s"
