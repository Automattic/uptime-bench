# Example capacity-benchmark plan for Jetmon v1 vs Jetmon v2.
# This file documents the input shape. It intentionally uses example hosts and
# is refused by live -apply runs. Copy jetmon.fleet.example.toml to a private
# jetmon.fleet.toml and replace placeholders for a deployed fleet.

id = "jetmon-v1-vs-v2-capacity"
prometheus_url = "http://prometheus.example.com:9090"
instances = ["jetmon-v1.example.com", "jetmon-v2.example.com"]

[window]
baseline_duration = "15m"
step = "15s"
rate_window = "2m"

[targets]
domain = "load.example.com"
host_pattern = "site-%07d.load.example.com"
url_pattern = "http://site-%07d.load.example.com/"
count = 1000000
url_start = 1

[target_preflight]
timeout = "5s"
expected_status = 200
check_sources = ["runner"]
# Set skip_http=true only when planning or when the runner cannot reach the
# generated target namespace. Live apply runs should leave HTTP checks enabled.
skip_http = false

[target_observer]
# Enables target-side black-box request counting during each capacity window.
# This is the v1-safe freshness signal because it observes monitor traffic at
# the target rather than changing Jetmon v1 code or schema.
enabled = false
target_control_url = "http://target.example.com:9000"
token_env = "CONTROL_TOKEN"
timeout = "5s"
# Defaults to 2x each service lifecycle check_interval when omitted.
# stale_after = "2m"
# Strict by default: any never-seen or stale target fails the batch. Use -1 to
# disable a check for exploratory runs.
max_never_seen_sites = 0
max_stale_sites = 0
# Optional throughput ratio thresholds. Leave 0 to record without failing.
# min catches services that under-check; max catches services that over-check,
# which matters for apples-to-apples cadence comparisons.
min_expected_request_ratio = 0
max_expected_request_ratio = 0

[capacity_replay]
# Applies deterministic target-side failures during capacity windows so a
# capacity run can prove that monitors still detect and recover from real
# outages while resource metrics are being captured. The target-control token
# defaults to target_observer.token_env/token_file when omitted.
enabled = false
target_control_url = "http://target.example.com:9000"
token_env = "CONTROL_TOKEN"
timeout = "5s"
seed = 8675309

  [[capacity_replay.events]]
  id = "http-503-sample"
  offset = "2m"
  duration = "2m"
  type = "http_status"
  status_code = 503
  sample_count = 25

[replay_detection]
# Correlates replayed downtime/recovery windows against service event history.
# Jetmon v2 is read through its benchmark DSN. Jetmon v1 requires the bridge's
# /events endpoint with persistent history enabled.
enabled = false
timeout = "15s"
v1_bridge_url = "http://jetmon-v1.example.com:7400"
v1_token_env = "JETMON_BRIDGE_TOKEN"
window_padding = "30s"
# When true, replay detection fails if event metadata reports a check interval
# different from the lifecycle interval configured by uptime-bench.
fail_on_check_interval_mismatch = false

[network_buckets]
# Installs an uptime-bench-owned nftables table on each selected service host
# before the capacity window and snapshots counter-only traffic buckets at the
# end of the window. The rules do not change packet verdicts.
enabled = false
ssh_config = "~/.ssh/config"
table = "uptime_bench_net_buckets"
timeout = "10s"

  [[network_buckets.hosts]]
  id = "jetmon-v1"
  instance = "jetmon-v1.example.com"
  ssh_host = "jetmon-v1.example.com"
  target_ip = "192.0.2.10"
  mysql_ip = "192.0.2.20"
  mysql_port = 3306
  monitoring_ip = "192.0.2.30"
  bridge_api_port = 7400
  peer_port = 7800

  [[network_buckets.hosts]]
  id = "jetmon-v2"
  instance = "jetmon-v2.example.com"
  ssh_host = "jetmon-v2.example.com"
  target_ip = "192.0.2.10"
  mysql_ip = "192.0.2.21"
  mysql_port = 3306
  monitoring_ip = "192.0.2.30"
  api_port = 8090
  peer_port = 7800

[disk_io_attribution]
# Captures read-only process, mount, pidstat, and iostat evidence on each
# selected service host so host disk pressure can be attributed in reports. When
# hosts are omitted, the runner reuses network_buckets.hosts.
enabled = false
ssh_config = "~/.ssh/config"
timeout = "20s"
sample_interval = "5s"

[streaming_telemetry]
# Captures Jetmon v2 streaming-scheduler journal summaries and, when the
# dashboard is bound locally on the service host, its /api/state snapshot.
enabled = false
ssh_config = "~/.ssh/config"
timeout = "10s"
unit = "jetmon2"

  [[streaming_telemetry.hosts]]
  service = "jetmon-v2"
  ssh_host = "jetmon-v2.example.com"
  unit = "jetmon2"
  dashboard_url = "http://127.0.0.1:8080"

[checks]
interval = "1m"

[batches]
sizes = [10, 100, 1000, 5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000]
duration = "30m"
cooldown = "5m"

[stop_thresholds]
host_cpu_percent = 85
host_memory_percent = 85
root_disk_percent = 90
missed_check_percent = 1
scrape_up_min = 1
dockerstats_scrape_success_min = 1

[jetmon_v1]
bridge_url = "http://jetmon-v1.example.com:7400"
bulk_lifecycle = "bridge_or_db_seeded_range"

  [jetmon_v1.lifecycle]
  schema = "v1"
  blog_id_start = 8000000000000000
  count = 1000000
  bucket_min = 0
  bucket_max = 99
  check_interval = "1m"
  batch_size = 1000
  dsn_env = "JETMON_V1_DB_DSN"
  # dsn_file = "/run/secrets/jetmon-v1-capacity-dsn"

[jetmon_v2]
api_url = "http://jetmon-v2.example.com:8090/api/v1"
bulk_lifecycle = "api_or_db_seeded_range"
scheduler_engine = "streaming"

  [jetmon_v2.lifecycle]
  schema = "v2"
  blog_id_start = 8000001000000000
  count = 1000000
  bucket_min = 0
  bucket_max = 99
  check_interval = "1m"
  batch_size = 1000
  dsn_env = "JETMON_V2_DB_DSN"
  # dsn_file = "/run/secrets/jetmon-v2-capacity-dsn"
