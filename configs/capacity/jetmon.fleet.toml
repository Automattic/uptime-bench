# Live local-fleet capacity benchmark plan for Jetmon v1 vs Jetmon v2.
# This file contains no DB secrets. Live -apply runs expect 0600 dsn_file
# secrets on the stable orchestrator host.

id = "jetmon-v1-vs-v2-capacity-fleet"
prometheus_url = "http://10.0.0.67:9091"
instances = ["jetmon-service-host-1", "jetmon-service-host-2"]

[window]
baseline_duration = "15m"
step = "15s"
rate_window = "2m"

[targets]
domain = "steadycadence.party"
url_pattern = "http://site-%07d.steadycadence.party/"
count = 1000000
url_start = 1

[checks]
interval = "1m"

[batches]
sizes = [10, 100, 1000, 5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000]
duration = "30m"
cooldown = "5m"

[stop_thresholds]
host_cpu_percent = 85
host_memory_percent = 85
root_disk_percent = 90
missed_check_percent = 1
scrape_up_min = 1
dockerstats_scrape_success_min = 1

[jetmon_v1]
bridge_url = "http://jetmon-service-host-1:7400"
bulk_lifecycle = "db_seeded_range"

  [jetmon_v1.lifecycle]
  schema = "v1"
  blog_id_start = 8000000000000000
  count = 1000000
  bucket_min = 0
  bucket_max = 99
  check_interval = "1m"
  batch_size = 1000
  dsn_file = "/home/jetmon/uptime-bench-capacity/secrets/jetmon-v1-capacity.dsn"

[jetmon_v2]
api_url = "http://jetmon-service-host-2:8090/api/v1"
bulk_lifecycle = "db_seeded_range"

  [jetmon_v2.lifecycle]
  schema = "v2"
  blog_id_start = 8000001000000000
  count = 1000000
  bucket_min = 0
  bucket_max = 99
  check_interval = "1m"
  batch_size = 1000
  dsn_file = "/home/jetmon/uptime-bench-capacity/secrets/jetmon-v2-capacity.dsn"
