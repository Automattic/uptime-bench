# Live local-fleet capacity benchmark plan for Jetmon v2 only.
# This file contains no DB secrets. Live -apply runs expect 0600 dsn_file
# secrets on the stable orchestrator host.

id = "jetmon-v2-capacity-fleet"
prometheus_url = "http://10.0.0.67:9091"
instances = ["jetmon-service-host-2"]

[window]
baseline_duration = "15m"
step = "15s"
rate_window = "2m"

[targets]
domain = "capacity.internal"
host_pattern = "site-%07d.capacity.internal"
url_pattern = "http://site-%07d.capacity.internal/"
count = 4000000
url_start = 1

[target_preflight]
timeout = "5s"
expected_status = 200
skip_http = false
dns_resolvers = ["10.0.0.176:53"]

[target_observer]
enabled = true
target_control_url = "http://10.0.0.176:9000"
token_file = "/home/jetmon/uptime-bench-capacity/secrets/control-token"
timeout = "5s"
min_expected_request_ratio = 0.80
max_expected_request_ratio = 1.25

[capacity_replay]
enabled = true
target_control_url = "http://10.0.0.176:9000"
token_file = "/home/jetmon/uptime-bench-capacity/secrets/control-token"
timeout = "5s"
seed = 8675309

  [[capacity_replay.events]]
  id = "v2-get-503-sample"
  offset = "3m"
  duration = "20m"
  type = "http_method_status"
  method = "GET"
  status_code = 503
  host_start = 1
  host_count = 0
  sample_count = 25

[replay_detection]
enabled = true
timeout = "15s"
window_padding = "30s"
fail_on_check_interval_mismatch = true

[network_buckets]
enabled = true
ssh_config = "/home/jetmon/.ssh/config"
table = "uptime_bench_net_buckets"
timeout = "10s"

  [[network_buckets.hosts]]
  id = "jetmon-v2"
  instance = "jetmon-service-host-2"
  ssh_host = "jetmon-service-host-2"
  target_ip = "10.0.0.176"
  mysql_ip = "10.0.0.173"
  mysql_port = 3307
  monitoring_ip = "10.0.0.67"
  api_port = 8090
  peer_port = 7803

[disk_io_attribution]
enabled = true
ssh_config = "/home/jetmon/.ssh/config"
timeout = "20s"
sample_interval = "5s"

[streaming_telemetry]
enabled = true
ssh_config = "/home/jetmon/.ssh/config"
timeout = "10s"
unit = "jetmon2"

  [[streaming_telemetry.hosts]]
  service = "jetmon-v2"
  ssh_host = "jetmon-service-host-2"
  unit = "jetmon2"
  dashboard_url = "http://127.0.0.1:8080"

[checks]
interval = "5m"

[batches]
sizes = [1500000, 2000000, 4000000]
duration = "30m"
cooldown = "5m"

[stop_thresholds]
host_cpu_percent = 85
host_memory_percent = 85
root_disk_percent = 90
missed_check_percent = 1
scrape_up_min = 1
dockerstats_scrape_success_min = 1

[jetmon_v1]
bridge_url = "http://jetmon-service-host-1:7400"
bulk_lifecycle = "db_seeded_range"

  [jetmon_v1.lifecycle]
  schema = "v1"
  blog_id_start = 1900000000
  count = 1
  bucket_min = 0
  bucket_max = 99
  check_interval = "5m"
  batch_size = 1000
  dsn_file = "/home/jetmon/uptime-bench-capacity/secrets/jetmon-v1-capacity.dsn"

[jetmon_v2]
api_url = "http://jetmon-service-host-2:8090/api/v1"
bulk_lifecycle = "db_seeded_range"
scheduler_engine = "streaming"

  [jetmon_v2.lifecycle]
  schema = "v2"
  blog_id_start = 8000001000000000
  count = 4000000
  bucket_min = 0
  bucket_max = 99
  check_interval = "5m"
  batch_size = 1000
  url_start = 1
  request_method = "GET"
  detection_profile = "full"
  dsn_file = "/home/jetmon/uptime-bench-capacity/secrets/jetmon-v2-capacity.dsn"
