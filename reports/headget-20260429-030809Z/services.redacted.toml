# Redacted services configuration captured for this HEAD/GET run.
#
# This file records the enabled monitor services used by the harness during
# the run. Secret fields are replaced with REDACTED.

# -----------------------------------------------------------------------------
# Jetmon 1
# -----------------------------------------------------------------------------
# url:  the jetmon-bridge HTTP endpoint. The default below assumes
#       jetmon-bridge runs on the harness server itself (localhost). If you run
#       Jetmon + jetmon-bridge on a separate server reached via Cloudflare
#       Tunnel or Tailscale, change this to that host's reachable URL.
# token: bearer token configured in jetmon-bridge (its -token flag). Generate
#        with `openssl rand -hex 32` and place the same value in jetmon-bridge.
# write_mode: leave "false" while monitors are pre-seeded in Jetmon. Set to
#             "true" if you want the harness to create/delete monitors via
#             POST /monitors and DELETE /monitors.
[[services]]
id      = "jetmon-v1"
type    = "jetmon-v1"
url     = "http://jetmon-v1:7400"
enabled = true
auth    = { token = "REDACTED", write_mode = "true" }

# -----------------------------------------------------------------------------
# Jetmon 2
# -----------------------------------------------------------------------------
[[services]]
id      = "jetmon-v2"
type    = "jetmon-v2"
url     = "http://jetmon-v2:8090/api/v1"
enabled = true
auth    = { token = "REDACTED", bucket_no = "0" }

# -----------------------------------------------------------------------------
